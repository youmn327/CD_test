<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코딩테스트 대시보드</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Coding Test Dashboard</h1>
      <p>프로그래머스 Lv.0 - 풀이 현황</p>
    </div>

    <!-- 멤버 카드 -->
    <div class="cards" id="member-cards"></div>

    <!-- 멤버 추가 모달 -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>새 멤버 추가</h3>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="form-group">
          <label for="new-member-id">아이디 (영문, 폴더명)</label>
          <input type="text" id="new-member-id" placeholder="예: hong" pattern="[a-zA-Z0-9_]+" >
        </div>
        <div class="form-group">
          <label for="new-member-name">표시 이름</label>
          <input type="text" id="new-member-name" placeholder="예: HONG">
        </div>
        <div class="form-group">
          <label for="new-member-color">테마 색상</label>
          <div class="color-picker-row">
            <input type="color" id="new-member-color" value="#7ee787" class="color-input">
            <span class="color-preview" id="color-preview" style="background:#7ee787;"></span>
          </div>
        </div>
        <div class="btn-group" style="justify-content:flex-end;">
          <button class="btn btn-secondary" onclick="closeModal()">취소</button>
          <button class="btn btn-primary" id="btn-create-member">생성</button>
        </div>
      </div>
    </div>

    <!-- 풀이 현황 (탭 스위칭) -->
    <div class="section">
      <div class="tab-header">
        <div class="tab-buttons">
          <button class="tab-btn active" data-tab="monthly">월별</button>
          <button class="tab-btn" data-tab="daily">일별</button>
        </div>
        <div class="nav-controls">
          <!-- 월별 nav -->
          <div class="nav-group" id="nav-monthly">
            <button class="nav-btn" id="prev-year">&larr;</button>
            <span class="nav-label" id="current-year"></span>
            <button class="nav-btn" id="next-year">&rarr;</button>
          </div>
          <!-- 일별 nav -->
          <div class="nav-group" id="nav-daily" style="display:none;">
            <button class="nav-btn" id="prev-month">&larr;</button>
            <span class="nav-label" id="current-month-label"></span>
            <button class="nav-btn" id="next-month">&rarr;</button>
          </div>
        </div>
      </div>

      <!-- 월별 테이블 -->
      <div class="tab-content active" id="tab-monthly">
        <div class="month-table-wrap">
          <table class="month-table">
            <thead>
              <tr>
                <th>이름</th>
                <th>1월</th><th>2월</th><th>3월</th><th>4월</th>
                <th>5월</th><th>6월</th><th>7월</th><th>8월</th>
                <th>9월</th><th>10월</th><th>11월</th><th>12월</th>
                <th>합계</th>
              </tr>
            </thead>
            <tbody id="month-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 일별 캘린더 -->
      <div class="tab-content" id="tab-daily">
        <div class="calendar-grid" id="calendar-grid"></div>
        <div class="cal-summary" id="cal-summary"></div>
      </div>
    </div>

    <!-- 최근 제출 -->
    <div class="section">
      <h2>최근 제출</h2>
      <div id="recent-list"></div>
    </div>

    <!-- 데이터 관리 -->
    <div class="section">
      <h2>데이터 관리</h2>
      <div class="btn-group">
        <button class="btn btn-secondary" id="btn-export-all">전체 JSON 내보내기</button>
        <label class="btn btn-secondary" style="cursor:pointer;">
          JSON 가져오기
          <input type="file" id="btn-import" accept=".json" style="display:none;">
        </label>
      </div>
      <div class="json-output" id="json-output"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script>
    let selectedYear = new Date().getFullYear();
    let selectedMonth = new Date().getMonth();
    let selectedDailyYear = new Date().getFullYear();

    init();

    function init() {
      renderMemberCards();
      renderMonthTable();
      renderCalendar();
      renderRecentSubmissions();

      document.getElementById('current-year').textContent = selectedYear;

      // 탭 스위칭
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
          document.getElementById('nav-monthly').style.display = btn.dataset.tab === 'monthly' ? '' : 'none';
          document.getElementById('nav-daily').style.display = btn.dataset.tab === 'daily' ? '' : 'none';
        });
      });

      // 월별 nav
      document.getElementById('prev-year').addEventListener('click', () => {
        selectedYear--;
        document.getElementById('current-year').textContent = selectedYear;
        renderMonthTable();
      });
      document.getElementById('next-year').addEventListener('click', () => {
        selectedYear++;
        document.getElementById('current-year').textContent = selectedYear;
        renderMonthTable();
      });

      // 일별 nav
      document.getElementById('prev-month').addEventListener('click', () => {
        selectedMonth--;
        if (selectedMonth < 0) { selectedMonth = 11; selectedDailyYear--; }
        renderCalendar();
      });
      document.getElementById('next-month').addEventListener('click', () => {
        selectedMonth++;
        if (selectedMonth > 11) { selectedMonth = 0; selectedDailyYear++; }
        renderCalendar();
      });

      document.getElementById('btn-export-all').addEventListener('click', exportAll);
      document.getElementById('btn-import').addEventListener('change', importData);
    }

    function getAllMembers() {
      return Storage.getAllMembers();
    }

    function renderMemberCards() {
      const container = document.getElementById('member-cards');
      const total = CONFIG.PROBLEMS.length;
      const members = getAllMembers();
      const customIds = Storage.getCustomMembers().map(m => m.id);

      const cards = members.map(member => {
        const solved = Storage.getByMember(member.id).length;
        const pct = Math.round((solved / total) * 100);
        const isCustom = customIds.includes(member.id);
        return `
          <div style="position:relative;">
            ${isCustom ? `<button class="card-delete-btn" onclick="event.preventDefault(); removeMember('${member.id}')" title="멤버 삭제">&times;</button>` : ''}
            <a href="${member.id}/index.html" style="text-decoration:none; color:inherit;">
              <div class="card">
                <div class="card-header">
                  <div class="avatar" style="background:${member.color};">${member.name[0]}</div>
                  <span class="card-title">${member.name}</span>
                </div>
                <div class="card-stat">${solved}<span style="font-size:16px; color:#8b949e;"> / ${total}</span></div>
                <div class="card-label">문제 풀이 완료 (${pct}%)</div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width:${pct}%; background:${member.color};"></div>
                </div>
              </div>
            </a>
          </div>
        `;
      }).join('');

      // 추가 카드
      const addCard = `
        <div class="card card-add" onclick="openModal()">
          <div class="card-add-icon">+</div>
          <div class="card-add-text">멤버 추가</div>
        </div>
      `;

      container.innerHTML = cards + addCard;
    }

    function renderMonthTable() {
      const tbody = document.getElementById('month-tbody');
      const summary = Storage.getMonthlySummary();

      tbody.innerHTML = getAllMembers().map(member => {
        const data = summary[member.id] || {};
        let yearTotal = 0;

        const cells = Array.from({ length: 12 }, (_, i) => {
          const key = `${selectedYear}-${String(i + 1).padStart(2, '0')}`;
          const count = data[key] || 0;
          yearTotal += count;
          return `<td><span class="cell-count ${count > 0 ? 'has-value' : ''}">${count || '-'}</span></td>`;
        }).join('');

        return `
          <tr>
            <td style="color:${member.color};">${member.name}</td>
            ${cells}
            <td class="total-col">${yearTotal}</td>
          </tr>
        `;
      }).join('');
    }

    function renderCalendar() {
      const m = selectedMonth + 1;
      document.getElementById('current-month-label').textContent = `${selectedDailyYear}년 ${m}월`;

      const grid = document.getElementById('calendar-grid');
      const daysInMonth = new Date(selectedDailyYear, m, 0).getDate();
      const firstDay = new Date(selectedDailyYear, selectedMonth, 1).getDay(); // 0=일
      const monthKey = `${selectedDailyYear}-${String(m).padStart(2, '0')}`;
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const today = new Date();

      // 일별 데이터 집계 (멤버별)
      const all = Storage.getAll();
      const dailyData = {}; // { day: { memberId: count } }
      all.forEach(s => {
        if (s.date.startsWith(monthKey)) {
          const day = parseInt(s.date.split('-')[2]);
          if (!dailyData[day]) dailyData[day] = {};
          dailyData[day][s.member] = (dailyData[day][s.member] || 0) + 1;
        }
      });

      let html = '';

      // 요일 헤더
      html += '<div class="cal-row cal-header">';
      dayNames.forEach((name, i) => {
        const cls = (i === 0 || i === 6) ? ' cal-weekend' : '';
        html += `<div class="cal-cell cal-day-name${cls}">${name}</div>`;
      });
      html += '</div>';

      // 날짜 셀
      let dayCount = 1;
      const totalWeeks = Math.ceil((firstDay + daysInMonth) / 7);

      for (let week = 0; week < totalWeeks; week++) {
        html += '<div class="cal-row">';
        for (let dow = 0; dow < 7; dow++) {
          const cellIndex = week * 7 + dow;
          if (cellIndex < firstDay || dayCount > daysInMonth) {
            html += '<div class="cal-cell cal-empty"></div>';
          } else {
            const d = dayCount;
            const isToday = selectedDailyYear === today.getFullYear() && selectedMonth === today.getMonth() && d === today.getDate();
            const isWeekend = dow === 0 || dow === 6;
            const data = dailyData[d] || {};
            const totalCount = Object.values(data).reduce((a, b) => a + b, 0);

            let cls = 'cal-cell cal-date';
            if (isToday) cls += ' cal-today';
            if (isWeekend) cls += ' cal-weekend';
            if (totalCount > 0) cls += ' cal-has-data';

            // 멤버별 뱃지
            let badges = '';
            getAllMembers().forEach(member => {
              const cnt = data[member.id] || 0;
              if (cnt > 0) {
                badges += `<span class="cal-badge" style="background:${member.color};">${member.name[0]} ${cnt}</span>`;
              }
            });

            html += `
              <div class="${cls}">
                <div class="cal-date-num${isWeekend ? ' cal-weekend-text' : ''}">${d}</div>
                <div class="cal-badges">${badges}</div>
              </div>
            `;
            dayCount++;
          }
        }
        html += '</div>';
      }

      grid.innerHTML = html;

      // 월간 멤버별 요약
      const summary = document.getElementById('cal-summary');
      const memberCounts = {};
      let grandTotal = 0;

      getAllMembers().forEach(member => { memberCounts[member.id] = 0; });
      all.forEach(s => {
        if (s.date.startsWith(monthKey)) {
          memberCounts[s.member] = (memberCounts[s.member] || 0) + 1;
          grandTotal++;
        }
      });

      // 활동 일수 계산
      const activeDays = {};
      getAllMembers().forEach(member => { activeDays[member.id] = new Set(); });
      all.forEach(s => {
        if (s.date.startsWith(monthKey)) {
          activeDays[s.member]?.add(s.date);
        }
      });

      summary.innerHTML = `
        <div class="cal-summary-title">${selectedDailyYear}년 ${m}월 요약</div>
        <div class="cal-summary-cards">
          ${getAllMembers().map(member => {
            const count = memberCounts[member.id];
            const days = activeDays[member.id].size;
            const avg = days > 0 ? (count / days).toFixed(1) : '0';
            return `
              <div class="cal-summary-card">
                <div class="cal-summary-avatar" style="background:${member.color};">${member.name[0]}</div>
                <div class="cal-summary-info">
                  <div class="cal-summary-name" style="color:${member.color};">${member.name}</div>
                  <div class="cal-summary-stat">${count}문제</div>
                  <div class="cal-summary-detail">${days}일 활동 &middot; 일평균 ${avg}문제</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        <div class="cal-summary-total">이번 달 전체: ${grandTotal}문제</div>
      `;
    }

    function renderRecentSubmissions() {
      const list = document.getElementById('recent-list');
      const all = Storage.getAll().reverse().slice(0, 10);

      if (all.length === 0) {
        list.innerHTML = '<div class="history-empty">아직 제출된 풀이가 없습니다.</div>';
        return;
      }

      list.innerHTML = all.map(s => {
        const member = getAllMembers().find(m => m.id === s.member);
        return `
          <div class="history-item">
            <div class="history-info">
              <div class="history-problem">
                <span style="color:${member?.color || '#8b949e'};">[${s.member}]</span>
                ${s.problemId} - ${s.problemName}
              </div>
              <div class="history-date">${s.date}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function exportAll() {
      const json = Storage.exportJSON();
      const el = document.getElementById('json-output');
      el.textContent = json;
      el.classList.toggle('show');

      if (el.classList.contains('show')) {
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'all_submissions.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('JSON 파일이 다운로드됩니다.');
      }
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          Storage.importJSON(ev.target.result);
          showToast('데이터를 가져왔습니다!');
          renderMemberCards();
          renderMonthTable();
          renderCalendar();
          renderRecentSubmissions();
        } catch {
          showToast('잘못된 JSON 파일입니다.', 'error');
        }
      };
      reader.readAsText(file);
    }

    // === 모달 ===
    function openModal() {
      document.getElementById('modal-overlay').classList.add('show');
      document.getElementById('new-member-id').value = '';
      document.getElementById('new-member-name').value = '';
      document.getElementById('new-member-color').value = '#7ee787';
      document.getElementById('color-preview').style.background = '#7ee787';
      document.getElementById('new-member-id').focus();
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('show');
    }

    document.getElementById('new-member-color').addEventListener('input', (e) => {
      document.getElementById('color-preview').style.background = e.target.value;
    });

    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.getElementById('btn-create-member').addEventListener('click', createMember);

    // === 멤버 생성 ===
    async function createMember() {
      const id = document.getElementById('new-member-id').value.trim().toLowerCase();
      const name = document.getElementById('new-member-name').value.trim() || id.toUpperCase();
      const color = document.getElementById('new-member-color').value;

      if (!id) return showToast('아이디를 입력하세요.', 'error');
      if (!/^[a-zA-Z0-9_]+$/.test(id)) return showToast('아이디는 영문, 숫자, _만 가능합니다.', 'error');

      const allMembers = getAllMembers();
      if (allMembers.some(m => m.id === id)) return showToast('이미 존재하는 아이디입니다.', 'error');

      // localStorage에 멤버 저장
      Storage.addMember({ id, name, color });

      // 폴더 + index.html 생성 (File System Access API)
      let folderCreated = false;
      try {
        const rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        const memberDir = await rootHandle.getDirectoryHandle(id, { create: true });
        const fileHandle = await memberDir.getFileHandle('index.html', { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(generateMemberPage(id, name, color));
        await writable.close();
        folderCreated = true;
      } catch (e) {
        if (e.name !== 'AbortError') {
          console.warn('폴더 생성 실패:', e);
        }
      }

      closeModal();
      renderMemberCards();
      renderMonthTable();
      renderCalendar();

      if (folderCreated) {
        showToast(`${name} 멤버 추가 + ${id}/index.html 생성 완료!`);
      } else {
        showToast(`${name} 멤버 추가 완료! (폴더 생성은 수동으로 해주세요)`);
      }
    }

    // === 멤버 삭제 ===
    async function removeMember(id) {
      if (!confirm(`"${id}" 멤버를 삭제하시겠습니까?\n폴더와 제출 데이터도 함께 삭제됩니다.`)) return;

      Storage.removeMember(id);

      // 폴더 삭제 (File System Access API)
      try {
        const rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        await rootHandle.removeEntry(id, { recursive: true });
        showToast(`${id} 멤버 + 폴더 삭제 완료!`);
      } catch (e) {
        if (e.name === 'AbortError') {
          showToast(`${id} 멤버 삭제 완료! (폴더는 수동으로 삭제하세요)`);
        } else if (e.name === 'NotFoundError') {
          showToast(`${id} 멤버 삭제 완료! (폴더가 없음)`);
        } else {
          showToast(`${id} 멤버 삭제 완료! (폴더 삭제 실패: ${e.message})`);
        }
      }

      renderMemberCards();
      renderMonthTable();
      renderCalendar();
      renderRecentSubmissions();
    }

    // === 개인 페이지 HTML 템플릿 생성 ===
    function generateMemberPage(id, name, color) {
      return `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${name} - 코딩테스트 풀이 제출</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-link">&larr; 대시보드로 돌아가기</a>

    <div class="header">
      <div class="avatar" style="background:${color}; width:56px; height:56px; font-size:24px; margin:0 auto 12px;">${name[0]}</div>
      <h1>${name}</h1>
      <p>프로그래머스 Lv.0 풀이 제출</p>
    </div>

    <div class="section" id="folder-section">
      <h2>저장 폴더 연결</h2>
      <p style="color:#8b949e; font-size:14px; margin-bottom:12px;">
        제출 데이터를 저장할 폴더를 선택하세요. (브라우저 당 최초 1회)
      </p>
      <div class="btn-group">
        <button class="btn btn-primary" id="btn-connect-folder">폴더 선택</button>
      </div>
      <div class="folder-status" id="folder-status"></div>
    </div>

    <div class="section">
      <h2>풀이 제출</h2>
      <div class="form-group">
        <label for="problem-select">문제 선택</label>
        <select id="problem-select">
          <option value="">-- 문제를 선택하세요 --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="code-input">풀이 코드</label>
        <textarea id="code-input" class="code-textarea" placeholder="풀이 코드를 입력하세요..." spellcheck="false"></textarea>
      </div>
      <div class="form-group">
        <label for="image-input">스크린샷 첨부 (선택)</label>
        <div class="image-upload-area" id="image-upload-area">
          <input type="file" id="image-input" accept="image/*" style="display:none;">
          <div class="image-placeholder" id="image-placeholder" onclick="document.getElementById('image-input').click()">
            클릭, 드래그, 또는 Ctrl+V로 이미지를 붙여넣으세요
          </div>
          <div class="image-preview-wrap" id="image-preview-wrap" style="display:none;">
            <img id="image-preview" class="image-preview">
            <button class="btn btn-danger" onclick="clearImage()" style="margin-top:8px;">이미지 제거</button>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="submit-date">제출 날짜</label>
        <input type="text" id="submit-date" readonly>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btn-submit">업로드</button>
        <button class="btn btn-secondary" id="btn-export">JSON 내보내기</button>
      </div>
      <div class="json-output" id="json-output"></div>
    </div>

    <div class="section">
      <h2>제출 기록 (<span id="history-count">0</span>건)</h2>
      <div id="history-list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/config.js"><` + `/script>
  <script src="../js/storage.js"><` + `/script>
  <script>
    const CURRENT_MEMBER = '${id}';
    const FILE_NAME = 'submissions.json';
    let dirHandle = null;
    let imageBase64 = null;

    initPage();

    function initPage() {
      populateProblems();
      setTodayDate();
      setupImageUpload();
      loadFromFile().then(() => renderHistory());
      document.getElementById('btn-connect-folder').addEventListener('click', connectFolder);
      document.getElementById('btn-submit').addEventListener('click', handleSubmit);
      document.getElementById('btn-export').addEventListener('click', handleExport);
    }

    function setupImageUpload() {
      const input = document.getElementById('image-input');
      const area = document.getElementById('image-upload-area');
      input.addEventListener('change', (e) => { if (e.target.files[0]) processImage(e.target.files[0]); });
      area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('drag-over'); });
      area.addEventListener('dragleave', () => area.classList.remove('drag-over'));
      area.addEventListener('drop', (e) => { e.preventDefault(); area.classList.remove('drag-over'); if (e.dataTransfer.files[0]) processImage(e.dataTransfer.files[0]); });
      document.addEventListener('paste', (e) => { const items = e.clipboardData?.items; if (!items) return; for (const item of items) { if (item.type.startsWith('image/')) { e.preventDefault(); processImage(item.getAsFile()); break; } } });
    }

    function processImage(file) {
      if (!file.type.startsWith('image/')) return showToast('이미지 파일만 가능합니다.', 'error');
      const reader = new FileReader();
      reader.onload = (e) => { imageBase64 = e.target.result; document.getElementById('image-preview').src = imageBase64; document.getElementById('image-preview-wrap').style.display = 'block'; document.getElementById('image-placeholder').style.display = 'none'; };
      reader.readAsDataURL(file);
    }

    function clearImage() { imageBase64 = null; document.getElementById('image-input').value = ''; document.getElementById('image-preview-wrap').style.display = 'none'; document.getElementById('image-placeholder').style.display = 'block'; }

    async function connectFolder() {
      try { dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' }); updateFolderStatus(true); showToast('폴더가 연결되었습니다!'); await loadFromFile(); renderHistory(); }
      catch (e) { if (e.name !== 'AbortError') showToast('폴더 연결에 실패했습니다.', 'error'); }
    }

    function updateFolderStatus(connected) {
      const el = document.getElementById('folder-status');
      if (connected) el.innerHTML = '<span style="color:#7ee787;">&#10003; 폴더 연결됨: ' + dirHandle.name + '/</span>';
      else el.innerHTML = '<span style="color:#8b949e;">연결된 폴더 없음</span>';
    }

    async function readFileFromDir() { if (!dirHandle) return null; try { const fh = await dirHandle.getFileHandle(FILE_NAME); const f = await fh.getFile(); return JSON.parse(await f.text()); } catch { return []; } }
    async function writeFileToDir(data) { if (!dirHandle) return false; try { const fh = await dirHandle.getFileHandle(FILE_NAME, { create: true }); const w = await fh.createWritable(); await w.write(JSON.stringify(data, null, 2)); await w.close(); return true; } catch (e) { showToast('파일 저장 실패: ' + e.message, 'error'); return false; } }

    async function loadFromFile() {
      if (!dirHandle) return;
      const data = await readFileFromDir();
      if (data && data.length > 0) { const existing = Storage.getAll(); const keys = new Set(existing.map(s => s.member + '-' + s.problemId + '-' + s.date)); let added = 0; data.forEach(s => { if (!keys.has(s.member + '-' + s.problemId + '-' + s.date)) { Storage.add(s); added++; } }); if (added > 0) showToast('파일에서 ' + added + '건 불러옴'); }
      refreshDropdown();
    }

    async function handleSubmit() {
      const problemId = document.getElementById('problem-select').value;
      const code = document.getElementById('code-input').value.trim();
      const date = document.getElementById('submit-date').dataset.iso;
      if (!problemId) return showToast('문제를 선택하세요.', 'error');
      if (!code) return showToast('코드를 입력하세요.', 'error');
      const problem = CONFIG.PROBLEMS.find(p => p.id === problemId);
      Storage.add({ member: CURRENT_MEMBER, problemId: problem.id, problemName: problem.name, code: code, date: date, image: imageBase64 || null });
      clearImage();
      if (dirHandle) { const all = Storage.getByMember(CURRENT_MEMBER); if (await writeFileToDir(all)) showToast(problem.name + ' 제출 완료! 파일에 저장됨'); }
      else showToast(problem.name + ' 제출 완료!');
      document.getElementById('code-input').value = '';
      document.getElementById('problem-select').value = '';
      refreshDropdown(); renderHistory();
    }

    function handleExport() {
      const subs = Storage.getByMember(CURRENT_MEMBER);
      const json = JSON.stringify(subs, null, 2);
      const el = document.getElementById('json-output');
      el.textContent = json; el.classList.toggle('show');
      if (el.classList.contains('show')) { const blob = new Blob([json], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = CURRENT_MEMBER + '_submissions.json'; a.click(); URL.revokeObjectURL(url); showToast('JSON 파일이 다운로드됩니다.'); }
    }

    function populateProblems() { const sel = document.getElementById('problem-select'); CONFIG.PROBLEMS.forEach(p => { const opt = document.createElement('option'); opt.value = p.id; const done = Storage.isSubmitted(CURRENT_MEMBER, p.id); opt.textContent = (done ? '\\u2713 ' : '') + p.id + ' - ' + p.name + ' (' + p.rate + '%)'; if (done) opt.style.color = '#7ee787'; sel.appendChild(opt); }); }
    function refreshDropdown() { const sel = document.getElementById('problem-select'); sel.innerHTML = '<option value="">-- 문제를 선택하세요 --</option>'; populateProblems(); }
    function setTodayDate() { const now = new Date(); const y = now.getFullYear(); const m = String(now.getMonth()+1).padStart(2,'0'); const d = String(now.getDate()).padStart(2,'0'); const days = ['일','월','화','수','목','금','토']; document.getElementById('submit-date').value = y+'-'+m+'-'+d+' ('+days[now.getDay()]+'요일)'; document.getElementById('submit-date').dataset.iso = y+'-'+m+'-'+d; }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const subs = Storage.getByMember(CURRENT_MEMBER).reverse();
      document.getElementById('history-count').textContent = subs.length;
      if (subs.length === 0) { list.innerHTML = '<div class="history-empty">아직 제출한 풀이가 없습니다.</div>'; return; }
      list.innerHTML = subs.map(s => '<div class="history-entry"><div class="history-item" onclick="toggleCode(\\'' + s.timestamp + '\\')"><div class="history-info"><div class="history-problem">' + (s.image ? '<span class="badge-img">IMG</span> ' : '') + s.problemId + ' - ' + s.problemName + '</div><div class="history-date">' + s.date + '</div></div><div class="history-actions"><span class="history-toggle" id="toggle-' + s.timestamp + '">&#9654;</span><button class="btn btn-danger" onclick="event.stopPropagation(); removeSubmission(\\'' + s.timestamp + '\\')">삭제</button></div></div><div class="history-detail" id="code-' + s.timestamp + '"><pre class="history-code-block">' + escapeHtml(s.code) + '</pre>' + (s.image ? '<img src="' + s.image + '" class="history-image" onclick="openImageModal(this.src)">' : '') + '</div></div>').join('');
    }

    function toggleCode(ts) { const d = document.getElementById('code-' + ts); const t = document.getElementById('toggle-' + ts); const o = d.classList.toggle('show'); t.innerHTML = o ? '&#9660;' : '&#9654;'; }
    function openImageModal(src) { const m = document.createElement('div'); m.className = 'image-modal'; m.innerHTML = '<img src="' + src + '"><div class="image-modal-close" onclick="this.parentElement.remove()">&#10005;</div>'; m.addEventListener('click', (e) => { if (e.target === m) m.remove(); }); document.body.appendChild(m); }
    function escapeHtml(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    async function removeSubmission(ts) { Storage.remove(ts); if (dirHandle) { await writeFileToDir(Storage.getByMember(CURRENT_MEMBER)); } refreshDropdown(); renderHistory(); showToast('삭제되었습니다.'); }

    function showToast(msg, type) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.className = 'toast' + (type === 'error' ? ' error' : ''); toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500); }
  <` + `/script>
</body>
</html>`;
    }

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast' + (type === 'error' ? ' error' : '');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
